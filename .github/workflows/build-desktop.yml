name: Build Electron App (CI only)

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "scripts/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run --cwd apps/desktop typecheck

  build:
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Rebuild native modules for Electron
        working-directory: apps/desktop
        run: node ../../scripts/rebuild-native.js

      - name: Copy production dependencies
        run: node scripts/copy-modules.js

      - name: Build with electron-vite
        working-directory: apps/desktop
        run: bun run build

      - name: Package with electron-builder
        working-directory: apps/desktop
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
